# Runs on every pull request and every push to main. A red check means: don't merge yet.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Production runs on PostgreSQL, so the tests do too (locally they use SQLite).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: applytrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/applytrack
      # The production settings force HTTPS, which the test client doesn't speak.
      DJANGO_DEBUG: "True"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: No model change without a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test
      - name: Production settings pass Django's deploy checklist
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: api.example.com
          DJANGO_SECRET_KEY: ci-only-but-long-enough-for-the-deploy-check-${{ github.run_id }}-abcdefghijklmnopqrstuvwxyz
          EMAIL_HOST: smtp.example.com
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: No known vulnerabilities in what ships to production
        run: npm audit --omit=dev --audit-level=high

  # Both apps running together, every page under every sign-in state (frontend/scripts/smoke.mjs).
  smoke:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "True"
      API_URL: http://127.0.0.1:8001/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start Django with a signed-in test user
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py createcachetable
          python manage.py shell -c "
          from accounts.models import User; from rest_framework.authtoken.models import Token
          user = User.objects.create_user('smoke@example.com', 'smoke-test-pass-123')
          print(Token.objects.create(user=user).key)" > ../token.txt
          python manage.py runserver 8001 --noreload > ../django.log 2>&1 &
      - name: Build and start Next.js
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run start > ../next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/login && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8001/api/health/
      - name: Smoke test
        run: node frontend/scripts/smoke.mjs "$(tail -n 1 token.txt)"
      - name: Server logs (on failure)
        if: failure()
        run: tail -n 100 django.log next.log
