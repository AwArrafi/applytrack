# Dependabot opens pull requests when a library has a new version; CI then tests them.
# Small updates come bundled in one weekly PR per folder; major versions get their own PR,
# since they can break things.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node's type definitions follow the Node version we run (24), not the newest Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript 7 (the rewritten compiler) breaks the linter for now; revisit when
      # typescript-eslint and Next.js support it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
